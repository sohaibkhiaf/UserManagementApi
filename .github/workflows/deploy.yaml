name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo, mysql
          tools: composer

      # 3. Install dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # 4. Install PHPCS & PHPLint (overtrue)
      - name: Install QA tools
        run: |
          composer require --dev squizlabs/php_codesniffer overtrue/phplint

      # 5. Run PHP CodeSniffer (Lint style)
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=PSR12 app/

      # 6. Run PHP Syntax Check (overtrue/phplint)
      - name: Run PHPLint
        run: |
          vendor/bin/phplint \
          app/ \
          routes/ \
          config/ \
          database/

      # Create .env for CI
      - name: Create .env
        run: |
          cat > .env <<EOF
          APP_ENV=${{ secrets.APP_ENV }}
          APP_KEY=${{ secrets.APP_KEY }}

          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      - name: List docker images 
        run: docker images

      # 8. Start containers
      - name: Start containers
        run: docker compose -f docker-compose.prod.yaml up -d 

      - name: List docker containers
        run: docker ps -a

      - name: Wait for DB (real fix)
        run: |
          for i in {1..30}; do
            if docker exec user_management_api php -r "
              try {
                new PDO('mysql:host=db;port=3306;dbname=${{ secrets.DB_DATABASE }}','${{ secrets.DB_USERNAME }}','${{ secrets.DB_PASSWORD }}');
                echo 'DB OK';
              } catch (Exception \$e) {
                exit(1);
              }"
            then
              echo "DB is reachable from app!"
              exit 0
            fi
            echo "Waiting for DB connection..."
            sleep 2
          done

          echo "DB connection failed"
          docker logs mysql
          exit 1

      # 8. Run Migrations
      - name: Run Migrations
        run: docker exec user_management_api php artisan migrate --force

      # 9. Seed Database
      - name: Seed Database
        run: docker exec user_management_api php artisan db:seed --force

      # 11. Run Tests (inside container)
      - name: Run Tests
        run: docker exec user_management_api php artisan test --filter=ApiTest

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 9. Build & Push App Image
      - name: Build & Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-management-api:latest

      # 10. Build & Push Nginx Image
      - name: Build & Push Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/usermanagementapi-webserver:latest

      # 11. SSH to Azure VM & Deploy (Won't work if something above failed)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/app

            # Create .env
            cat > .env <<EOF
            APP_ENV=${{ secrets.APP_ENV }}
            APP_KEY=${{ secrets.APP_KEY }}

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            # Pull latest images
            docker compose -f docker-compose.prod.yaml pull

            # Restart containers
            docker compose -f docker-compose.prod.yaml down
            docker compose -f docker-compose.prod.yaml up -d

            # Laravel commands
            docker exec user_management_api php artisan migrate --force
            docker exec user_management_api php artisan config:cache


